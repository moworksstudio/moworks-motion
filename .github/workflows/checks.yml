# Checks GitHub runs on every pull request and every push to main (audit 12/10/2026: the repo had no CI).
# Only what needs no packages, no browser, no brand packs and no After Effects: the maintainer still runs the smoke test,
# kit.py gallery check and the AE cases on the Windows machine before a commit (CLAUDE.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Every tracked JSON file reads, every Python file compiles
        shell: python
        run: |
          import json, subprocess, sys
          files = [f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode("utf-8").split("\0") if f]
          bad = []
          for f in files:
              try:
                  if f.endswith(".json"): json.loads(open(f, encoding="utf-8").read())
                  elif f.endswith(".py"): compile(open(f, encoding="utf-8").read(), f, "exec")
              except Exception as e: bad.append(f"{f}: {e}")
          print("\n".join(bad) or f"{len(files)} files: every .json reads, every .py compiles")
          sys.exit(1 if bad else 0)

      - name: Library (preset.json, frame rules, as-shipped SHA-256)
        run: python engine/kit.py gallery check --static

      - name: Skill zip matches its source
        run: python engine/tests/pack_skill.py --check

      - name: Looks copied as shipped
        run: python engine/tests/hf_looks.py --check

      - name: Nothing that stays on the studio's machine is tracked (publish-check)
        run: python engine/kit.py publish-check
